<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1220" />
    <title>정수리 체크 · 탈모 셀프 측정</title>
    <meta name="description" content="정수리 사진으로 두피 노출도를 측정하는 참고용 셀프 체크 앱. 사진은 기기 안에서만 분석됩니다." />

    <!-- PWA / 안드로이드 설치형 웹앱 -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="정수리 체크" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <div class="logo"><span class="logo-dot"></span>정수리 체크</div>
        <button id="homeBtn" class="ghost-btn" hidden>처음으로</button>
      </header>

      <main class="app-main" id="main"><!-- 화면이 여기에 렌더링됩니다 --></main>

      <footer class="app-footer">
        본 결과는 의료 진단이 아닌 참고용 셀프 체크입니다. 정확한 진단은 피부과 전문의와
        상담하세요.
      </footer>
    </div>

    <!-- 숨겨진 파일 입력 -->
    <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden />
    <input id="fileInput" type="file" accept="image/*" hidden />

    <script type="module" src="./app.js"></script>

    <!-- 서비스 워커 등록 (오프라인 지원) -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('./sw.js')
            .catch((err) => console.warn('SW 등록 실패:', err))
        })
      }
    </script>
  </body>
</html>
