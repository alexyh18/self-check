name: Android APK

# 웹앱(Capacitor)을 안드로이드 디버그 APK로 빌드해 Artifact로 업로드합니다.
# - push/PR 시 자동 실행
# - Actions 탭에서 수동 실행(Run workflow)도 가능
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # v3 기본값이 레거시 'tools' 패키지를 설치하려다 실패하므로 비활성화.
          # 필요한 platform/build-tools 는 Gradle(AGP)이 자동으로 받습니다.
          packages: ''

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        run: npm install

      - name: Build web assets (www/)
        run: npm run copy:web

      - name: Add Android platform (Capacitor)
        run: |
          npx cap add android
          npx cap sync android

      - name: Set app icons (adaptive)
        run: |
          # Capacitor 기본 아이콘을 우리 아이콘으로 교체 (가능한 모든 밀도에 512 아이콘 사용)
          ICON=icons/icon-512.png
          ROUND=icons/icon-maskable-512.png
          for dpi in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            DIR="android/app/src/main/res/mipmap-$dpi"
            mkdir -p "$DIR"
            cp "$ICON" "$DIR/ic_launcher.png"
            cp "$ICON" "$DIR/ic_launcher_foreground.png"
            cp "$ROUND" "$DIR/ic_launcher_round.png"
          done

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/scalp-check-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: scalp-check-debug-apk
          path: dist/scalp-check-debug.apk
          if-no-files-found: error
