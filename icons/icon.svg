<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2b47"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#7affd1"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- 정수리(두피) 원 -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#ring)" stroke-width="22"/>
  <!-- 분석 포인트(모낭) -->
  <g fill="#7affd1">
    <circle cx="256" cy="186" r="12"/>
    <circle cx="316" cy="226" r="10"/>
    <circle cx="196" cy="226" r="10"/>
    <circle cx="306" cy="300" r="9"/>
    <circle cx="206" cy="300" r="9"/>
  </g>
  <!-- 중앙 두피 노출(측정 지점) -->
  <circle cx="256" cy="262" r="34" fill="#4f8cff" opacity="0.9"/>
  <circle cx="256" cy="262" r="16" fill="#dc3232"/>
</svg>
